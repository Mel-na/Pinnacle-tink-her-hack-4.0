<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Guardians - Astrashe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-[#102220] text-white min-h-screen p-6 font-sans">
    <div class="flex items-center gap-4 mb-8">
        <a href="/home" class="p-2 bg-white/10 rounded-full"><span class="material-symbols-outlined">arrow_back</span></a>
        <h1 class="text-2xl font-bold">Trusted Guardians</h1>
    </div>

    <form class="bg-[#0c1a19] p-5 rounded-2xl border border-white/10 mb-8" onsubmit="event.preventDefault(); alert('Guardian Added!');">
        <h2 class="text-sm text-[#13ecda] font-bold mb-4 uppercase">Add New Guardian</h2>
        <input type="text" placeholder="Guardian Name" class="w-full bg-[#102220] border border-white/20 rounded-lg p-3 mb-3 text-white" required>
        <input type="tel" placeholder="Phone Number" class="w-full bg-[#102220] border border-white/20 rounded-lg p-3 mb-4 text-white" required>
        <button type="submit" class="w-full bg-[#13ecda] text-black font-bold py-3 rounded-lg">SAVE GUARDIAN</button>
    </form>

    <h2 class="text-sm text-slate-400 font-bold mb-4 uppercase">Active Guardians</h2>
    <div class="flex items-center justify-between bg-[#0c1a19] p-4 rounded-xl border border-white/10">
        <div>
            <p class="font-bold">Mom</p>
            <p class="text-xs text-slate-400">+91 98765 43210</p>
        </div>
        <span class="material-symbols-outlined text-[#13ecda]">verified</span>
    </div>
</body>
</html>
