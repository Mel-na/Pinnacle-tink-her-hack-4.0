<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Astrashe Home Screen</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecda",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102220",
                        "emergency": "#ff4d4d",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>

    <style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-mask {
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 overflow-hidden h-screen flex flex-col">

    <header class="flex items-center justify-between px-6 pt-12 pb-4 bg-background-light dark:bg-background-dark z-20">
        <div class="flex items-center gap-3">
            <div class="size-10 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
                <span class="material-symbols-outlined text-primary">shield_person</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Astrashe</h1>
        </div>

        <div class="flex gap-2">
            <a href="/alerts" class="size-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400">
                <span class="material-symbols-outlined">notifications</span>
            </a>
            <a href="/logout" class="size-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400">
                <span class="material-symbols-outlined">logout</span>
            </a>
        </div>
    </header>

    <main class="relative flex-1 w-full overflow-hidden map-mask">
        
        <div id="map" class="absolute inset-0 z-0 bg-slate-300 dark:bg-[#0a1514]"></div>

        <div class="absolute top-4 left-0 right-0 px-4 z-10">
            <form action="/safe" method="GET" class="flex w-full items-center bg-white/80 dark:bg-slate-900/90 backdrop-blur-md rounded-xl shadow-xl border border-white/20 dark:border-slate-800/50 p-1">
                <div class="flex items-center justify-center pl-3 text-slate-400">
                    <span class="material-symbols-outlined">search</span>
                </div>
                <input name="destination" class="w-full bg-transparent border-none focus:ring-0 text-slate-900 dark:text-slate-100 placeholder:text-slate-500 py-3 text-base outline-none" placeholder="Enter Destination in Kerala..." type="text" required/>
                <button type="submit" class="size-10 rounded-lg bg-primary/10 flex items-center justify-center mr-1 transition-transform active:scale-95">
                    <span class="material-symbols-outlined text-primary">my_location</span>
                </button>
            </form>
        </div>

        <div class="absolute right-4 bottom-10 z-10 flex flex-col gap-3">
            <button class="size-12 rounded-full bg-white dark:bg-slate-900 shadow-lg flex items-center justify-center text-slate-700 dark:text-slate-300">
                <span class="material-symbols-outlined">layers</span>
            </button>
            <button class="size-12 rounded-full bg-white dark:bg-slate-900 shadow-lg flex items-center justify-center text-slate-700 dark:text-slate-300 border-2 border-primary/40">
                <span class="material-symbols-outlined text-primary">security</span>
            </button>
        </div>

    </main>

    <section class="relative z-30 bg-background-light dark:bg-[#0c1a19] px-6 pt-6 pb-12 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.3)] border-t border-slate-200 dark:border-slate-800">

        <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>

        <div class="flex flex-col gap-4">
            <a href="/safe" class="w-full bg-primary text-background-dark font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-3 active:scale-[0.98] transition-transform text-center">
                <span class="material-symbols-outlined font-bold">directions_walk</span>
                Find Safest Route
            </a>

            <a href="/safeplace" class="w-full bg-emergency text-white font-bold text-lg py-5 rounded-xl shadow-xl shadow-emergency/30 flex items-center justify-center gap-3 active:scale-[0.98] transition-transform text-center">
                <span class="material-symbols-outlined font-bold">emergency</span>
                I FEEL UNSAFE
            </a>
        </div>

        <div class="mt-6 flex justify-around text-slate-500 dark:text-slate-400">
            <div class="flex flex-col items-center gap-1">
                <span class="material-symbols-outlined text-primary">verified_user</span>
                <span class="text-[10px] font-medium uppercase tracking-wider">Safe Zone</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <span class="material-symbols-outlined">group</span>
                <span class="text-[10px] font-medium uppercase tracking-wider">3 Trusted Near</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <span class="material-symbols-outlined">map</span>
                <span class="text-[10px] font-medium uppercase tracking-wider">Street Live</span>
            </div>
        </div>

    </section>

    <nav class="bg-white dark:bg-[#0c1a19] border-t border-slate-200 dark:border-slate-800 flex justify-around items-center px-4 pb-8 pt-3">
        <a class="flex flex-col items-center gap-1 text-primary" href="/home">
            <span class="material-symbols-outlined font-fill" style="font-variation-settings: 'FILL' 1;">home</span>
            <span class="text-[10px] font-bold">Home</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="/safe">
            <span class="material-symbols-outlined">map</span>
            <span class="text-[10px]">Routes</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="/safeplace">
            <span class="material-symbols-outlined">shield_with_heart</span>
            <span class="text-[10px]">Safety</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="/settings">
            <span class="material-symbols-outlined">person</span>
            <span class="text-[10px]">Profile</span>
        </a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Kerala
        var map = L.map('map', {zoomControl: false}).setView([10.8505, 76.2711], 7);
        
        // Dark theme map tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // Add a marker for current location (e.g., Ernakulam or Kannur)
        var currentLat = 10.0159; 
        var currentLng = 76.3419;
        L.circleMarker([currentLat, currentLng], {
            color: '#13ecda', 
            radius: 8, 
            fillOpacity: 0.8
        }).addTo(map).bindPopup("Your Location");
    </script>
</body>
</html>
