<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Alerts - Astrashe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-[#102220] text-white min-h-screen p-6 font-sans">
    <div class="flex items-center gap-4 mb-8">
        <a href="/home" class="p-2 bg-white/10 rounded-full"><span class="material-symbols-outlined">arrow_back</span></a>
        <h1 class="text-2xl font-bold">SOS Alert History</h1>
    </div>

    <div class="space-y-4">
        <div class="bg-red-900/20 border border-red-500/50 p-4 rounded-xl flex items-start gap-4">
            <span class="material-symbols-outlined text-red-500 mt-1">warning</span>
            <div>
                <p class="font-bold text-red-500">Danger Encountered - Thrissur</p>
                <p class="text-xs text-slate-400 mb-2">Today at 8:45 PM</p>
                <p class="text-sm text-slate-300">Live location and alert sent to 1 Guardian (Mom).</p>
            </div>
        </div>

        <div class="bg-[#0c1a19] border border-white/10 p-4 rounded-xl flex items-start gap-4">
            <span class="material-symbols-outlined text-[#13ecda] mt-1">info</span>
            <div>
                <p class="font-bold text-white">Safe Route Completed</p>
                <p class="text-xs text-slate-400 mb-2">Yesterday at 6:30 PM</p>
                <p class="text-sm text-slate-300">Arrived safely at destination: Ernakulam.</p>
            </div>
        </div>
    </div>
</body>
</html>
