<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astrashe Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecda",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102220",
                        "midnight": "#0a1615",
                        "accent-purple": "#7c3aed"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #102220;
        }
        .gradient-bg {
            background: radial-gradient(circle at top right, rgba(124, 58, 237, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(19, 236, 218, 0.1), transparent 40%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center font-display overflow-hidden">
<!-- Background Decorative Gradients -->
<div class="fixed inset-0 gradient-bg pointer-events-none"></div>
<div class="relative w-full max-w-[430px] h-full min-h-screen flex flex-col px-8 pt-16 pb-12 z-10">
<!-- Top Navigation (iOS Style) -->
<div class="flex items-center justify-between mb-12">
<button class="text-slate-900 dark:text-slate-100 hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-3xl">chevron_left</span>
</button>
</div>
<!-- Hero Section -->
<div class="flex flex-col items-center mb-16">
<div class="mb-4">
<div class="w-20 h-20 bg-primary/20 rounded-xl flex items-center justify-center border border-primary/30">
<span class="material-symbols-outlined text-primary text-5xl">shield_person</span>
</div>
</div>
<h1 class="text-5xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">Astrashe</h1>
<p class="text-slate-500 dark:text-primary/70 text-sm font-medium tracking-wide uppercase">Your Safe Routing Assistant</p>
</div>
<!-- Login Form -->
<div class="flex flex-col gap-6 w-full">
<div class="flex flex-col gap-2">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 ml-1">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-primary/50 text-xl">mail</span>
</div>
<input class="w-full bg-white dark:bg-midnight border border-slate-200 dark:border-primary/20 rounded-xl py-4 pl-12 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-primary/50 text-xl">lock</span>
</div>
<input class="w-full bg-white dark:bg-midnight border border-slate-200 dark:border-primary/20 rounded-xl py-4 pl-12 pr-12 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 dark:text-slate-600 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="mt-4 flex flex-col gap-4">
<button class="w-full bg-primary hover:bg-primary/90 text-midnight font-bold py-4 rounded-xl transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
                    Login
                </button>
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
<span class="flex-shrink mx-4 text-xs font-medium text-slate-400 uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
</div>
<div class="flex gap-4">
<button class="flex-1 flex items-center justify-center gap-2 bg-white dark:bg-midnight border border-slate-200 dark:border-slate-800 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors">
<span class="material-symbols-outlined text-xl">fingerprint</span>
<span class="text-sm font-semibold">Biometrics</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2 bg-white dark:bg-midnight border border-slate-200 dark:border-slate-800 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors">
<span class="material-symbols-outlined text-xl">brand_awareness</span>
<span class="text-sm font-semibold">Apple</span>
</button>
</div>
</div>
</div>
<!-- Footer -->
<div class="mt-auto pt-8 text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Sign Up</a>
</p>
</div>
<!-- Safety Badge -->
<div class="mt-8 flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-slate-100 dark:bg-slate-900/50 self-center">
<span class="material-symbols-outlined text-primary text-sm">verified_user</span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-slate-500 dark:text-slate-400">Encrypted &amp; Secure Environment</span>
</div>
</div>
<!-- Background Illustration (Subtle) -->
<div class="fixed -bottom-20 -right-20 w-80 h-80 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[320px] text-primary">diversity_1</span>
</div>
</body></html>
